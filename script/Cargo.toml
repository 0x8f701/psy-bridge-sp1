[package]
name = "psy-bridge-sp1-script"
version.workspace = true
edition.workspace = true
autobins = false

[[bin]]
name = "gen-proof"
path = "src/bin/gen_proof.rs"

[[bin]]
name = "doge-proof-worker"
path = "src/bin/doge_proof_worker.rs"


[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.2"
hex = "0.4.3"
psy-bridge-sp1-lib = { path = "../lib" }
psy-doge-bridge-helper = { path = "../../dlc-lib/doge-light-client-workspace/psy-doge-bridge-helper", default-features = false, features = ["sha2", "serialize_borsh", "serialize_bytemuck", "serialize_speedy"] }
redis = { version = "0.30", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp1-sdk = { version = "6.3.1", features = ["cuda"] }
sha2.workspace = true
tokio = { version = "1.52", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
sp1-build = "6.3.1"
